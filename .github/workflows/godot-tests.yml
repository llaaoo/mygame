name: Godot regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64"
      - name: Import and run isolated regressions
        run: python3 tools/run_tests.py --godot "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-test-logs
          path: /tmp/mygame-tests-*/*.log
          if-no-files-found: warn
